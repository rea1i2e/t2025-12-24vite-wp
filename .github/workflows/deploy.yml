name: Deploy Theme to FTP

# WordPress テーマのテスト環境デプロイ（develop → テスト FTP）。
# 本番は deploy-production.yml（main のみ）。develop／main 分離。
# サイト全体 Basic（docroot の .htaccess / .htpasswd）は CI では扱わない。
# 案件セットアップ時の apply-wordpress-basic-remote.sh（ナレッジ basic-auth-staging）が正。

# FTP デプロイの除外リスト（env で1箇所定義）
env:
  FTP_EXCLUDE: |
    **/.git*
    **/.git*/**
    **/node_modules/**
    **/.github/**
    **/ai-docs/**
    **/src/**
    **/scripts/**
    **/raw/**
    **/*.map
    **/package.json
    **/package-lock.json
    **/vite.config.*
    **/postcss.config.*
    **/README.md
    **/.DS_Store
    **/Thumbs.db
    **/.cursorrules
    **/AGENTS.md
    **/.husky/**
    **/tools/**
    **/.env*
    **/env.deploy.example
    **/memo/**
    **/.claude/**
    **/.cursor/**
    **/CLAUDE.md
    **/capture-qa.config.json
    **/qa-screenshots/**
    **/config/**
    **/staging/**
    **/manual/**
    **/vite.hot
    **/.prod-deploy-baseline.json
    **/.ftp-deploy-sync-state.json

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets 未登録（リポ作成直後・setup-secrets.sh 前）でも赤くならないよう、
    # FTP_SERVER の有無でデプロイ／通知ステップを出し分けるための写し。
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Detect deploy-relevant changes
      id: changes
      uses: dorny/paths-filter@v4
      with:
        filters: |
          deploy:
            - 'src/**'
            - 'scripts/**'
            - 'config/**'
            - 'vite.config.*'
            - 'postcss.config.*'
            - 'package.json'
            - 'package-lock.json'
            - '*.php'
            - 'style.css'
            - 'components/**'
            - 'components-demo/**'
            - 'functions-lib/**'
            - 'acf-json/**'
            - 'apple-touch-icon.png'
            - 'favicon.ico'
            - 'dist/**'

    - name: Note skipped deployment
      if: steps.changes.outputs.deploy != 'true' && github.event_name != 'workflow_dispatch'
      run: |
        echo "## ⏭️ デプロイスキップ" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ビルド／デプロイ対象外のファイルのみの変更のため、ビルド・FTP・Discord 通知は行いません。" >> $GITHUB_STEP_SUMMARY

    - name: Setup Node.js
      if: steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      if: steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
      run: npm ci

    - name: Build project
      id: build_project
      if: steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
      run: npm run build

    - name: Generate deployment summary
      if: always() && (steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch')
      run: |
        echo "## 📋 デプロイサマリー" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**ブランチ:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**コミット:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**コミッター:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "**イベント:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -n "${{ secrets.TEST_URL }}" ]; then
          echo "**🌐 テスト環境:** ${{ secrets.TEST_URL }}" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📁 デプロイ対象（テーマ一式）" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "Theme root files (examples):" >> $GITHUB_STEP_SUMMARY
        ls -1 *.php style.css 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Built assets (examples):" >> $GITHUB_STEP_SUMMARY
        find dist -type f \( -name "*.css" -o -name "*.js" -o -name "*.json" -o -name "*.woff2" -o -name "*.svg" -o -name "*.jpg" -o -name "*.png" -o -name "*.webp" \) 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || true
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 確認リンク" >> $GITHUB_STEP_SUMMARY
        echo "- [GitHub Actions ログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
        echo "- [コミット詳細](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY

    - name: Determine deploy eligibility
      id: eligible
      if: steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
      run: |
        if [ -n "${FTP_SERVER}" ] && [ -n "${FTP_SERVER_DIR}" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "**テーマ FTP:** スキップ（\`FTP_SERVER\` または \`FTP_SERVER_DIR\` が未登録）" >> "$GITHUB_STEP_SUMMARY"
        fi

    # 一時的な FTP 接続タイムアウトを吸収するため、continue-on-error で1回だけ自動リトライする。
    - name: Deploy to Test Environment
      id: deploy_main
      if: (steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') && steps.eligible.outputs.enabled == 'true'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        timeout: 120000
        exclude: ${{ env.FTP_EXCLUDE }}

    - name: Wait before FTP retry
      if: steps.deploy_main.outcome == 'failure'
      run: sleep 30

    - name: Deploy to Test Environment (retry)
      id: deploy_retry
      if: steps.deploy_main.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ${{ secrets.FTP_SERVER_DIR }}
        timeout: 120000
        exclude: ${{ env.FTP_EXCLUDE }}

    - name: Fail if deploy did not succeed
      if: always() && steps.build_project.outcome == 'success' && steps.eligible.outputs.enabled == 'true'
      run: |
        if [ "${{ steps.deploy_main.outcome }}" = "success" ]; then
          exit 0
        fi
        if [ "${{ steps.deploy_retry.outcome }}" = "success" ]; then
          exit 0
        fi
        echo "テスト FTP が失敗しました"
        exit 1

    - name: Send Discord Notification - Test Deploy
      if: success() && (steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') && steps.eligible.outputs.enabled == 'true' && env.DISCORD_WEBHOOK != ''
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          🧪 **テスト環境デプロイ完了**

          **ブランチ:** ${{ github.ref_name }}
          **コミット:** ${{ github.sha }}
          **コミッター:** ${{ github.actor }}
          **メッセージ:** ${{ github.event.head_commit.message }}

          **テストURL:** ${{ secrets.TEST_URL }}

          **🔍 変更確認:**
          • [GitHub Actions ログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          • [コミット詳細](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

    - name: Send Discord Notification - Build Failure
      if: failure() && (steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') && steps.build_project.outcome == 'failure' && env.DISCORD_WEBHOOK != ''
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          ❌ **ビルド失敗**

          **ブランチ:** ${{ github.ref_name }}
          **コミット:** ${{ github.sha }}
          **コミッター:** ${{ github.actor }}
          **イベント:** ${{ github.event_name }}

          **🔍 詳細確認:**
          • [GitHub Actions ログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          • [コミット詳細](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

    - name: Send Discord Notification - Deploy Failure
      if: failure() && (steps.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch') && steps.eligible.outputs.enabled == 'true' && steps.build_project.outcome != 'failure' && (steps.deploy_main.outcome == 'failure' || steps.deploy_retry.outcome == 'failure') && env.DISCORD_WEBHOOK != ''
      uses: Ilshidur/action-discord@master
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      with:
        args: |
          ❌ **デプロイ失敗**

          **ブランチ:** ${{ github.ref_name }}
          **コミット:** ${{ github.sha }}
          **コミッター:** ${{ github.actor }}
          **イベント:** ${{ github.event_name }}

          **🔍 詳細確認:**
          • [GitHub Actions ログ](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          • [コミット詳細](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

          **🌐 環境URL:**
          • テスト環境: ${{ secrets.TEST_URL }}
